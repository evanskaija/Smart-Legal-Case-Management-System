  <title>SLCMS — Smart Legal Case Management System</title>
  <meta name="description" content="Enterprise Smart Legal Case Management System for modern law firms, managing litigation, clients, privileged documents, statutory deadlines and billing.">
  
  <!-- SLCMS Brand Favicon & Icons -->
  <link rel="icon" type="image/png" href="assets/SLCMS.png">
  <link rel="shortcut icon" type="image/png" href="assets/SLCMS.png">
  <link rel="apple-touch-icon" href="assets/SLCMS.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Chart.js for Legal Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- SockJS & STOMP for Real-time WebSocket Case Chat -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>

</head>
<body style="background-color: #0B1F33;">

  <div id="app-root">
    <!-- Immediate Branded Pre-loader (eliminates blank white screen on page refresh) -->
    <div id="initial-page-loader" style="position: fixed; inset: 0; background: #0B1F33; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Inter', -apple-system, sans-serif; color: #FFFFFF; user-select: none;">
      <div style="position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;">
        <div style="position: absolute; inset: -5px; border-radius: 50%; border: 2px solid rgba(200, 155, 60, 0.2); border-top-color: #C89B3C; animation: slcms-spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;"></div>
        <img src="assets/SLCMS.png" alt="SLCMS" style="width: 54px; height: 54px; border-radius: 50%; object-fit: contain; box-shadow: 0 0 24px rgba(200, 155, 60, 0.35);">
      </div>
      <div style="font-size: 1.2rem; font-weight: 800; letter-spacing: 0.08em; color: #FFFFFF; font-family: 'Outfit', sans-serif;">SLCMS<span style="color: #C89B3C;">.</span></div>
      <div style="font-size: 0.72rem; letter-spacing: 0.08em; color: #94A3B8; margin-top: 0.35rem; text-transform: uppercase;">Smart Legal Case Management</div>
      <div style="width: 140px; height: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; margin-top: 1.5rem; overflow: hidden; position: relative;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, #C89B3C, #FDE68A); border-radius: 9999px; animation: slcms-bar 1.2s ease-in-out infinite alternate;"></div>
      </div>
      <style>
        @keyframes slcms-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slcms-bar { 0% { transform: translateX(-30%); width: 30%; } 100% { transform: translateX(200%); width: 60%; } }
      </style>
    </div>
  </div>

  <!-- Global Modal Dialog Container -->
  <div id="global-modal-overlay" class="modal-overlay" onclick="if(event.target === this) App.closeModal()">
    <div id="global-modal-content" class="modal-content"></div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="toast-container"></div>
