# ==============================================================================
# SLCMS Production Spring Boot Application Configuration
# ==============================================================================

server.port=${PORT:8080}

# Database Configuration (XAMPP MariaDB/MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/slcms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Dar_es_Salaam&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:slcms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SlcmsLegalPass2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL: Strictly 'update' to preserve all records and auto-create schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Prevent automatic schema reset scripts
spring.sql.init.mode=never

# Security & JWT Configuration
slcms.jwt.secret=${JWT_SECRET:slcms-enterprise-secure-jwt-secret-key-2026-tanzania-legal}
slcms.jwt.expiration-hours=24

# CORS: Allowed Frontend URL (e.g., https://your-slcms.vercel.app)
slcms.cors.frontend-url=${FRONTEND_URL:https://your-slcms.vercel.app}

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Storage & Real Backup Configuration
slcms.storage.data-directory=./data
slcms.storage.upload-directory=./uploads
slcms.backup.mysqldump-path=${MYSQLDUMP_PATH:C:/xampp/mysql/bin/mysqldump.exe}
slcms.backup.database=${BACKUP_DATABASE:slcms_db}
slcms.backup.username=${BACKUP_DB_USERNAME:root}
slcms.backup.password=${BACKUP_DB_PASSWORD:}
slcms.backup.directory=${BACKUP_DIRECTORY:./backups}
slcms.upload.directory=${UPLOAD_DIRECTORY:./uploads}
slcms.backup.keep-count=7
slcms.backup.scheduled.enabled=false
slcms.backup.scheduled.frequency=DAILY
slcms.backup.scheduled.time=00:00

# Official Gmail API Configuration
slcms.gmail.sender=slcmslegal@gmail.com
slcms.gmail.credentials-path=secure/gmail-credentials.json
slcms.gmail.tokens-directory=tokens


